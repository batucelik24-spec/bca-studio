<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BCA Studio Editör</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#F5F5F7;--panel:#FFFFFF;--fg:#1D1D1F;--muted:#6E6E73;--line:rgba(0,0,0,.1);--accent:#0066CC;--danger:#C4314B;--ok:#1E8E3E;--f:'Jost','Futura','Avenir Next',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--f)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:14px 24px;background:rgba(245,245,247,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar h1{margin:0;font-weight:400;font-size:18px;letter-spacing:.02em}
.bar h1 b{font-weight:500}
.bar .status{font-size:13px;color:var(--muted);margin-right:auto}
.bar .status.err{color:var(--danger)}.bar .status.ok{color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-size:14px;transition:background .2s}
.btn:hover{background:#ECECEF}
.btn.primary{background:var(--fg);color:#fff;border-color:var(--fg)}
.btn.primary:hover{background:#000}
.btn.primary[disabled]{opacity:.4;cursor:default}
.btn.small{padding:4px 12px;font-size:13px}
.btn.danger{color:var(--danger)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 62px)}
nav{border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
nav h2{font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:24px 8px 8px}
nav h2:first-child{margin-top:0}
nav button.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;font-size:15px}
nav button.item:hover{background:rgba(0,0,0,.05)}
nav button.item[aria-current="true"]{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
nav .tag{margin-left:auto;font-size:11px;color:var(--muted)}
nav .dirty{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
main{padding:40px clamp(20px,5vw,72px) 120px;max-width:980px}
main h2{font-weight:300;font-size:34px;letter-spacing:-.01em;margin:0 0 6px}
main .sub{color:var(--muted);margin:0 0 32px}
.field{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.field>label,.field>.lbl{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:10px}
.field .hint{font-size:13px;color:var(--muted);margin-top:6px}
input[type=text],input[type=password],textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,102,204,.15)}
textarea{min-height:110px;resize:vertical}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:flex-start}
.row>*:not(.ctl){flex:1}
.ctl{display:flex;gap:4px;flex:none}
.icon{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;font-size:15px;line-height:1}
.icon:hover{background:#ECECEF}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.cover{display:flex;gap:16px;align-items:flex-start}
.cover .thumb{width:220px;aspect-ratio:4/3;border-radius:10px;background:#E8E8ED center/cover no-repeat;flex:none;border:1px solid var(--line)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gallery figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gallery .img{aspect-ratio:4/3;background:#E8E8ED center/cover no-repeat}
.gallery figcaption{display:flex;justify-content:space-between;align-items:center;padding:6px}
.gallery figcaption .ctl .icon{width:28px;height:28px;font-size:13px}
.pending{outline:2px dashed var(--accent);outline-offset:-2px}
.toggle{display:flex;align-items:center;gap:10px;padding-top:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-weight:400;font-size:20px}
.person{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px}
.person .ph{width:96px;height:120px;border-radius:10px;background:#E8E8ED center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:22px}
.person .grid2{display:grid;grid-template-columns:1fr 1fr 90px;gap:8px;margin-bottom:8px}
.note{background:#FFF8E1;border:1px solid #F3E2A9;border-radius:12px;padding:14px 16px;font-size:14px;margin-bottom:24px}
.note.info{background:#EEF5FF;border-color:#CFE0F7}
.gate{max-width:560px;margin:10vh auto;padding:0 24px}
.gate h2{font-weight:300;font-size:40px;margin:0 0 12px}
.gate ol{padding-left:20px;color:var(--muted)}
.gate ol li{margin-bottom:6px}
.gate a{color:var(--accent)}
.foot{display:flex;gap:10px;margin-top:28px}
.empty{color:var(--muted);font-size:14px}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .field{grid-template-columns:1fr;gap:6px}
  .field>label,.field>.lbl{padding-top:0}
  .cover{flex-direction:column}
  .person{grid-template-columns:1fr}
  .person .grid2{grid-template-columns:1fr}
  .bar{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="bar">
  <h1><b>BCA Studio</b> · Editör</h1>
  <span class="status" id="status">Yükleniyor…</span>
  <button class="btn" id="preview" type="button" hidden>Taslağı önizle</button>
  <button class="btn primary" id="publish" type="button" hidden disabled>Yayınla</button>
</div>
<div id="app"></div>
<iframe id="site" src="index.html?editor" title="Site verisi" aria-hidden="true" tabindex="-1" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-9999px"></iframe>

<script>
(function(){
'use strict';
const REPO = {owner:'batucelik24-spec', repo:'bca-studio', branch:'main'};
const TEXT_LABELS = {
  'home.statement':'Ana sayfa · Hakkımızda başlığı',
  'home.about':'Ana sayfa · Hakkımızda paragrafları',
  'home.team.lead':'Ana sayfa · Ekip giriş metni',
  'arch.lead':'Architecture · Üst açıklama',
  'arch.cta.title':'Architecture · İletişim başlığı',
  'arch.cta.text':'Architecture · İletişim metni',
  'studio.lead':'Studio · Üst açıklama',
  'studio.intro.title':'Studio · Giriş başlığı',
  'studio.intro.text':'Studio · Giriş paragrafları',
  'studio.cat.projects':'Studio · Projeler açıklaması',
  'studio.cat.apps':'Studio · Uygulamalar açıklaması',
  'studio.cat.research':'Studio · Ar-Ge açıklaması',
  'studio.notes.lead':'Studio · Notlar açıklaması',
  'studio.collab.title':'Studio · İş birliği başlığı',
  'studio.collab.lead':'Studio · İş birliği açıklaması',
  'studio.services':'Studio · Hizmetler',
  'studio.mail':'Studio · İletişim satırı'
};
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const e = document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==='class') e.className=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2), v); else if(k.startsWith('aria-') && typeof v==='boolean') e.setAttribute(k, String(v)); else if(v!==false && v!=null) e.setAttribute(k, v===true?'':v); } kids.flat().forEach(c=>{ if(c!=null && c!==false) e.append(c.nodeType?c:document.createTextNode(c)); }); return e; };
const clone = o => JSON.parse(JSON.stringify(o));
const same = (a,b) => JSON.stringify(a)===JSON.stringify(b);
const store = {get(k){try{return localStorage.getItem(k);}catch(e){return null;}}, set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}, del(k){try{localStorage.removeItem(k);}catch(e){}}};

let BASE, CATS, state, view = {type:'project', id:null}, uploads = {}; // uploads: path -> {dataUrl, base64}
const status = (t, cls='') => { const s = $('#status'); s.textContent = t; s.className = 'status '+cls; };

/* ---------- loading: the hidden site frame exposes built-in content and the published edits ---------- */
const frame = $('#site');
frame.addEventListener('load', ()=>{
  let tries = 0;
  const wait = setInterval(()=>{
    const w = frame.contentWindow, site = w && w.BCA_SITE;
    if(site && site.base && site.base.projects.length){
      clearInterval(wait);
      BASE = clone(site.base); CATS = site.cats || [];
      const published = clone(w.BCA_CONTENT || {});
      frame.remove();
      init(published);
    } else if(++tries > 150){ clearInterval(wait); status('Site verisi okunamadı. Sayfayı yenileyin.', 'err'); }
  }, 100);
});

function compose(content){
  const projects = BASE.projects.map((p,i)=>Object.assign(clone(p), {order:i}, content.projects && content.projects[p.code] || {}));
  (content.added || []).forEach(a=>projects.push(Object.assign({cats:[],facts:[],desc:[],gallery:[],img:'',kind:'',line:'',year:'',badge:'',hidden:false,studio:false}, clone(a), {added:true, order: a.order ?? projects.length})));
  projects.sort((a,b)=>a.order-b.order); projects.forEach((p,i)=>p.order=i);
  return {
    projects,
    team: content.team ? clone(content.team) : clone(BASE.team),
    texts: Object.assign(clone(BASE.texts), content.texts || {})
  };
}

/* only what differs from the built-in content is written to content.js */
function diff(){
  const out = {version:1, updated:new Date().toISOString()}, projects = {}, added = [];
  const baseOrder = BASE.projects.map(p=>p.code), order = state.projects.filter(p=>!p.added).map(p=>p.code);
  const reordered = !same(baseOrder, order) || state.projects.some((p,i)=>p.added && i < state.projects.length-1 && !state.projects.slice(i+1).every(q=>q.added));
  state.projects.forEach(p=>{
    if(p.added){ const a = clone(p); delete a.added; added.push(a); return; }
    const b = BASE.projects.find(x=>x.code===p.code), o = {};
    ['name','kind','line','year','cats','facts','desc','img','gallery','badge','hidden'].forEach(k=>{ if(!same(p[k], b[k])) o[k] = clone(p[k]); });
    if(reordered) o.order = p.order;
    if(Object.keys(o).length) projects[p.code] = o;
  });
  if(Object.keys(projects).length) out.projects = projects;
  if(added.length) out.added = added;
  if(!same(state.team, BASE.team)) out.team = clone(state.team);
  const texts = {}; Object.entries(state.texts).forEach(([k,v])=>{ if(v !== BASE.texts[k]) texts[k] = v; });
  if(Object.keys(texts).length) out.texts = texts;
  return out;
}

let publishedJSON = '';
const norm = o => JSON.stringify({projects:o.projects||{}, added:o.added||[], team:o.team||null, texts:o.texts||{}});
function init(published){
  publishedJSON = norm(published);
  const saved = store.get('bca-editor-state');
  state = compose(published);
  if(saved){ try{ const s = JSON.parse(saved); if(s && s.projects && s.basePublished === publishedJSON){ state = {projects:s.projects, team:s.team, texts:s.texts}; } }catch(e){} }
  view = {type:'project', id:state.projects[0].code};
  $('#preview').hidden = false; $('#publish').hidden = false;
  render(); touch(false);
}

function changed(){ return norm(diff()) !== publishedJSON || Object.keys(uploads).length > 0; }
function touch(save=true){
  if(save) store.set('bca-editor-state', JSON.stringify(Object.assign({basePublished:publishedJSON}, state)));
  const dirty = changed();
  $('#publish').disabled = !dirty;
  status(dirty ? 'Yayınlanmamış değişiklikler var' + (Object.keys(uploads).length ? ' · '+Object.keys(uploads).length+' yeni görsel' : '') : 'Site ile aynı', dirty ? '' : 'ok');
  renderNav();
}

/* ---------- images: resized in the browser, committed with the next publish ---------- */
function slug(s){ return String(s||'gorsel').toLowerCase().replace(/[çÇ]/g,'c').replace(/[ğĞ]/g,'g').replace(/[ıİ]/g,'i').replace(/[öÖ]/g,'o').replace(/[şŞ]/g,'s').replace(/[üÜ]/g,'u').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'gorsel'; }
function pickImages(multiple){
  return new Promise(res=>{ const i = el('input',{type:'file',accept:'image/*'}); if(multiple) i.multiple = true; i.onchange = ()=>res([...i.files]); i.click(); });
}
async function addUpload(file, prefix){
  const bmp = await createImageBitmap(file); const max = 2400, k = Math.min(1, max/Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const png = /png$/i.test(file.type) && file.size < 1.5e6, type = png ? 'image/png' : 'image/jpeg';
  const dataUrl = c.toDataURL(type, .86), ext = png ? 'png' : 'jpg';
  const path = 'img/uploads/'+slug(prefix)+'-'+slug(file.name.replace(/\.[^.]+$/,''))+'-'+Date.now().toString(36)+'.'+ext;
  uploads[path] = {dataUrl, base64: dataUrl.split(',')[1]};
  return path;
}
const src = p => uploads[p] ? uploads[p].dataUrl : p;

/* ---------- navigation ---------- */
function renderNav(){
  const nav = $('nav'); if(!nav) return;
  const d = diff(), dirtyP = code => (d.projects && d.projects[code]) || (d.added && d.added.some(a=>a.code===code));
  nav.replaceChildren(
    el('h2',{},'Mimarlık projeleri'),
    ...state.projects.filter(p=>!p.studio).map(navItem),
    el('button',{class:'item',type:'button',onclick:()=>newProject(false)},'＋ Yeni proje'),
    el('h2',{},'Studio projeleri'),
    ...state.projects.filter(p=>p.studio).map(navItem),
    el('button',{class:'item',type:'button',onclick:()=>newProject(true)},'＋ Yeni Studio projesi'),
    el('h2',{},'Site'),
    el('button',{class:'item',type:'button','aria-current':view.type==='team','onclick':()=>go('team')},'Ekip', d.team ? el('span',{class:'dirty'}) : null),
    el('button',{class:'item',type:'button','aria-current':view.type==='texts','onclick':()=>go('texts')},'Sayfa metinleri', d.texts ? el('span',{class:'dirty'}) : null),
    el('button',{class:'item',type:'button','aria-current':view.type==='settings','onclick':()=>go('settings')},'Bağlantı ayarı', token() ? null : el('span',{class:'tag'},'gerekli'))
  );
  function navItem(p){
    return el('button',{class:'item',type:'button','aria-current':view.type==='project'&&view.id===p.code, onclick:()=>go('project',p.code)},
      p.name || p.code, dirtyP(p.code) ? el('span',{class:'dirty'}) : null, p.hidden ? el('span',{class:'tag'},'gizli') : null);
  }
}
function go(type, id){ view = {type, id}; render(); scrollTo(0,0); }

function render(){
  const app = $('#app');
  app.replaceChildren(el('div',{class:'layout'}, el('nav'), el('main',{id:'main'})));
  renderNav();
  const main = $('#main');
  if(view.type==='project') renderProject(main, state.projects.find(p=>p.code===view.id) || state.projects[0]);
  else if(view.type==='team') renderTeam(main);
  else if(view.type==='texts') renderTexts(main);
  else renderSettings(main);
}

/* ---------- form helpers ---------- */
function field(label, control, hint){ return el('div',{class:'field'}, el('div',{class:'lbl'},label), el('div',{}, control, hint ? el('div',{class:'hint'},hint) : null)); }
function input(value, set, attrs={}){ return el('input',Object.assign({type:'text',value:value||'',oninput:e=>{set(e.target.value);touch();}},attrs)); }
function area(value, set, attrs={}){ const t = el('textarea',Object.assign({oninput:e=>{set(e.target.value);touch();}},attrs)); t.value = value||''; return t; }
function move(arr, i, d){ const j = i+d; if(j<0||j>=arr.length) return false; [arr[i],arr[j]]=[arr[j],arr[i]]; return true; }
function ctl(arr, i, rerender){
  return el('div',{class:'ctl'},
    el('button',{class:'icon',type:'button',title:'Yukarı','aria-label':'Yukarı taşı',onclick:()=>{ if(move(arr,i,-1)){touch();rerender();} }},'↑'),
    el('button',{class:'icon',type:'button',title:'Aşağı','aria-label':'Aşağı taşı',onclick:()=>{ if(move(arr,i,1)){touch();rerender();} }},'↓'),
    el('button',{class:'icon',type:'button',title:'Sil','aria-label':'Sil',onclick:()=>{ arr.splice(i,1);touch();rerender(); }},'×'));
}

/* ---------- project ---------- */
function renderProject(main, p){
  const again = ()=>render();
  const list = state.projects, idx = list.indexOf(p);
  main.append(
    el('h2',{},p.name || 'Yeni proje'),
    el('p',{class:'sub'},(p.studio?'Studio':'Architecture')+' · kod '+p.code+(p.added?' · yeni eklendi':'')),
    field('Proje adı', input(p.name, v=>{p.name=v; const h=main.querySelector('h2'); if(h) h.textContent=v||'Yeni proje';})),
    field('Tür', input(p.kind, v=>p.kind=v), 'Kartlarda ve kapakta küçük harflerle görünür. Örnek: Kültür · Opera'),
    field('Yıl', input(p.year, v=>p.year=v)),
    field('Kısa tanım', area(p.line, v=>p.line=v, {style:'min-height:70px'}), 'Listede ve proje sayfasının başında görünen tek cümle.'),
    p.studio ? null : field('Kategoriler', el('div',{class:'chips'}, CATS.map(c=>el('button',{type:'button',class:'chip','aria-pressed':p.cats.includes(c),onclick:e=>{ p.cats = p.cats.includes(c) ? p.cats.filter(x=>x!==c) : p.cats.concat(c); e.target.setAttribute('aria-pressed',p.cats.includes(c)); touch(); }},c)))),
    field('Öne çıkan etiket', input(p.badge, v=>p.badge=v), 'İsteğe bağlı. Örnek: 1. Ödül'),
    field('Kapak görseli', coverControl(p)),
    field('Galeri', galleryControl(p), 'Sıra, proje sayfasındaki görsel sırasıdır. Kesikli çerçeveli görseller henüz yayınlanmadı.'),
    field('Künye', factsControl(p), 'Konum, rol, ofis, proje sahibi gibi satırlar.'),
    field('Metin paragrafları', descControl(p), 'Proje sayfasındaki bilgi, konsept ve detay bölümleri bu paragraflardan oluşur.'),
    field('Görünürlük', el('label',{class:'toggle'}, el('input',{type:'checkbox',checked:p.hidden,onchange:e=>{p.hidden=e.target.checked;touch();}}), 'Bu projeyi sitede gizle')),
    field('Sıralama', el('div',{class:'ctl'},
      el('button',{class:'btn small',type:'button',onclick:()=>{ if(move(list,idx,-1)){ list.forEach((q,i)=>q.order=i); touch(); again(); } }},'Listede yukarı'),
      el('button',{class:'btn small',type:'button',onclick:()=>{ if(move(list,idx,1)){ list.forEach((q,i)=>q.order=i); touch(); again(); } }},'Listede aşağı'))),
    p.added ? el('div',{class:'foot'}, el('button',{class:'btn danger',type:'button',onclick:()=>{ if(confirm(p.name+' projesi silinsin mi?')){ list.splice(idx,1); touch(); go('project', list[0].code); } }},'Projeyi sil')) : null
  );
}
function coverControl(p){
  const box = el('div',{class:'cover'});
  const draw = ()=>box.replaceChildren(
    el('div',{class:'thumb'+(uploads[p.img]?' pending':''),style:p.img?'background-image:url("'+src(p.img)+'")':''}),
    el('div',{class:'list',style:'flex:1'},
      input(p.img, v=>{p.img=v;draw();}, {'aria-label':'Kapak görseli yolu'}),
      el('div',{class:'ctl'},
        el('button',{class:'btn small',type:'button',onclick:async()=>{ const [f] = await pickImages(false); if(!f) return; p.img = await addUpload(f, p.code+'-kapak'); touch(); draw(); }},'Yeni görsel yükle'),
        p.gallery.length ? el('button',{class:'btn small',type:'button',onclick:()=>{ const pick = prompt('Galeriden kaçıncı görsel kapak olsun? (1-'+p.gallery.length+')'); const n = parseInt(pick,10); if(n>=1&&n<=p.gallery.length){ p.img = p.gallery[n-1]; touch(); draw(); } }},'Galeriden seç') : null)));
  draw(); return box;
}
function galleryControl(p){
  const wrap = el('div',{class:'list'});
  const draw = ()=>wrap.replaceChildren(
    p.gallery.length ? el('div',{class:'gallery'}, p.gallery.map((g,i)=>el('figure',{class:uploads[g]?'pending':''},
      el('div',{class:'img',style:'background-image:url("'+src(g)+'")',title:g}),
      el('figcaption',{}, el('span',{class:'empty'},String(i+1).padStart(2,'0')), el('div',{class:'ctl'},
        el('button',{class:'icon',type:'button','aria-label':'Sola',onclick:()=>{ if(move(p.gallery,i,-1)){touch();draw();} }},'←'),
        el('button',{class:'icon',type:'button','aria-label':'Sağa',onclick:()=>{ if(move(p.gallery,i,1)){touch();draw();} }},'→'),
        el('button',{class:'icon',type:'button','aria-label':'Kaldır',onclick:()=>{ p.gallery.splice(i,1);touch();draw(); }},'×')))))) : el('p',{class:'empty'},'Galeride görsel yok.'),
    el('div',{class:'ctl'}, el('button',{class:'btn small',type:'button',onclick:async()=>{ const files = await pickImages(true); for(const f of files) p.gallery.push(await addUpload(f, p.code)); touch(); draw(); }},'Görsel ekle')));
  draw(); return wrap;
}
function factsControl(p){

      input(f[0], v=>f[0]=v, {style:'flex:.6','aria-label':'Başlık'}), input(f[1], v=>f[1]=v, {'aria-label':'Değer'}), ctl(p.facts,i,draw))),

function descControl(p){

function newProject(studio){
  const name = prompt(studio ? 'Yeni Studio projesinin adı:' : 'Yeni projenin adı:'); if(!name) return;
  let code = slug(name).replace(/-/g,'').slice(0,3).toUpperCase() || 'NEW', n = 2; const base = code;
  while(state.projects.some(p=>p.code===code)) code = base + n++;
  const p = {code, studio, added:true, name, kind:'', line:'', year:String(new Date().getFullYear()), cats:[], facts:[['Yıl',String(new Date().getFullYear())],['Konum','']], desc:[''], img:'', gallery:[], badge:'', hidden:false, order:state.projects.length};
  state.projects.push(p); touch(); go('project', code);
}

/* ---------- settings: the GitHub key lives only in this browser ---------- */
const token = () => store.get('bca-editor-token') || '';
function renderSettings(main){
  main.append(el('h2',{},'Bağlantı ayarı'),
    el('p',{class:'sub'},'Yayınla düğmesinin siteyi güncelleyebilmesi için GitHub erişim anahtarı gerekiyor. Anahtar yalnızca bu tarayıcıda saklanır; siteye ya da depoya yazılmaz.'),
    el('div',{class:'note info'}, el('b',{},'Anahtar nasıl alınır'), el('ol',{style:'margin:8px 0 0;padding-left:20px'},
      el('li',{},'github.com → sağ üstte profil → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.'),
      el('li',{},'Repository access: "Only select repositories" → bca-studio.'),
      el('li',{},'Permissions → Repository permissions → Contents: "Read and write".'),
      el('li',{},'Oluşan anahtarı aşağıya yapıştır ve kaydet.'))),
    field('GitHub anahtarı', (()=>{ const i = el('input',{type:'password',value:token(),autocomplete:'off',placeholder:'github_pat_…'}); return el('div',{class:'list'}, i, el('div',{class:'ctl'},
      el('button',{class:'btn small',type:'button',onclick:async()=>{ store.set('bca-editor-token', i.value.trim()); const ok = await checkToken(); status(ok ? 'Anahtar çalışıyor' : 'Anahtar depoya yazamıyor', ok ? 'ok' : 'err'); renderNav(); }},'Kaydet ve dene'),
      el('button',{class:'btn small',type:'button',onclick:()=>{ store.del('bca-editor-token'); i.value=''; renderNav(); status('Anahtar silindi'); }},'Anahtarı sil'))); })()),
    field('Taslak', el('div',{class:'ctl'}, el('button',{class:'btn small danger',type:'button',onclick:()=>{ if(confirm('Yayınlanmamış tüm değişiklikler silinsin mi?')){ store.del('bca-editor-state'); uploads = {}; location.reload(); } }},'Taslağı sıfırla')), 'Yayınlanmamış değişiklikleri siler, sitenin yayındaki haline döner.'));
}

/* ---------- GitHub ---------- */
async function gh(path, opts={}){
  const r = await fetch('https://api.github.com/repos/'+REPO.owner+'/'+REPO.repo+path, Object.assign({}, opts, {headers:Object.assign({'Authorization':'Bearer '+token(),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}, opts.body?{'Content-Type':'application/json'}:{})}));
  if(!r.ok){ const t = await r.text(); throw new Error(r.status+' '+t.slice(0,160)); }
  return r.json();
}
async function checkToken(){ try{ const r = await gh(''); return !!(r.permissions && r.permissions.push); }catch(e){ return false; } }
function contentFile(d){ return '/* BCA Studio — editor.html writes this file. Built-in content applies wherever a field is absent. */\nwindow.BCA_CONTENT = '+JSON.stringify(d, null, 1)+';\n'; }
const b64 = s => btoa(unescape(encodeURIComponent(s)));

async function publish(){
  if(!token()){ go('settings'); status('Önce bağlantı ayarını yap', 'err'); return; }
  const btn = $('#publish'); btn.disabled = true;
  try{
    status('Yayınlanıyor…');
    const ref = await gh('/git/ref/heads/'+REPO.branch), head = await gh('/git/commits/'+ref.object.sha);
    const tree = [];
    const paths = Object.keys(uploads);
    for(let i=0;i<paths.length;i++){
      status('Görseller yükleniyor '+(i+1)+'/'+paths.length+'…');
      const blob = await gh('/git/blobs',{method:'POST',body:JSON.stringify({content:uploads[paths[i]].base64,encoding:'base64'})});
      tree.push({path:paths[i],mode:'100644',type:'blob',sha:blob.sha});
    }
    const d = diff();
    const cblob = await gh('/git/blobs',{method:'POST',body:JSON.stringify({content:b64(contentFile(d)),encoding:'base64'})});
    tree.push({path:'content.js',mode:'100644',type:'blob',sha:cblob.sha});
    const t = await gh('/git/trees',{method:'POST',body:JSON.stringify({base_tree:head.tree.sha,tree})});
    const c = await gh('/git/commits',{method:'POST',body:JSON.stringify({message:'Editör: içerik güncellendi'+(paths.length?' ('+paths.length+' görsel)':''),tree:t.sha,parents:[ref.object.sha]})});
    await gh('/git/refs/heads/'+REPO.branch,{method:'PATCH',body:JSON.stringify({sha:c.sha})});
    uploads = {}; publishedJSON = norm(d);
    store.set('bca-editor-state', JSON.stringify(Object.assign({basePublished:publishedJSON}, state)));
    touch(false); render();
    status('Yayınlandı. Site yaklaşık 1 dakika içinde güncellenir.', 'ok');
  }catch(e){
    console.error(e); status('Yayınlanamadı: '+(/40[13]/.test(e.message)?'anahtar geçersiz ya da yazma izni yok':e.message), 'err'); btn.disabled = false;
  }
}
$('#publish').addEventListener('click', publish);

$('#preview').addEventListener('click', ()=>{
  const d = diff(), json = JSON.stringify(d).replace(/"(img\/uploads\/[^"]+)"/g, (m,p)=>uploads[p] ? '"'+uploads[p].dataUrl+'"' : m);
  if(!store.set('bca-editor-draft', json) && !store.set('bca-editor-draft', JSON.stringify(d))){ alert('Taslak bu tarayıcıya kaydedilemedi.'); return; }
  open('index.html?draft', '_blank');
});
addEventListener('beforeunload', e=>{ if(Object.keys(uploads).length){ e.preventDefault(); e.returnValue=''; } });
})();
